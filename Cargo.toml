[workspace]
resolver = "2"
members = [
    "crates/es-protocol",
    "crates/es-broker",
    "crates/es-cli",
    "crates/es-tools",
    "crates/es-client",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
es-protocol = { path = "crates/es-protocol" }

anyhow = "1"
arc-swap = "1"
axum = "0.7"
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"] }
base64 = "0.22"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
crc32fast = "1"
dashmap = "6"
flate2 = "1"
futures = "0.3"
humantime = "2"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
rustls-pki-types = { version = "1", features = ["std"] }
libc = "0.2"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower = "0.5"
tar = "0.4"
tower-http = { version = "0.5", features = ["trace", "cors", "limit", "catch-panic"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1

# The shipped binaries: tag builds (`build-binaries` in ci.yml) and the Docker
# image. Fat LTO optimizes the whole crate graph as one unit — the last few
# percent, and the build the README's throughput figures were measured on.
# Stripped: the tarballs are for running, not for debugging.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = "symbols"
