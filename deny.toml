[advisories]
# Fail on known vulnerabilities, yanked crates, and unsound or unmaintained
# crates — unless listed below with the reason they are accepted.
version = 2
yanked = "deny"
ignore = [
    # rustls-pemfile is unmaintained (no vulnerability). It comes in through
    # axum-server 0.7's TLS feature, which only parses the PEM files the
    # operator configures; the broker's own PEM loading uses rustls-pki-types.
    # Drop this when axum-server is upgraded to a release without it.
    { id = "RUSTSEC-2025-0134", reason = "unmaintained, transitive via axum-server 0.7" },
]

[licenses]
allow = ["MIT", "Apache-2.0", "Unicode-DFS-2016", "Unicode-3.0", "BSL-1.0", "ISC", "OpenSSL", "BSD-3-Clause", "MIT-0", "CDLA-Permissive-2.0"]
confidence-threshold = 0.8

[[licenses.exceptions]]
name = "ring"
allow = ["ISC", "MIT", "OpenSSL"]

[bans]
multiple-versions = "warn"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
